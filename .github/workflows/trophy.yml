# Place this file at: .github/workflows/trophy.yml in your EmaAnd8/EmaAnd8 repo
#
# Generates trophy.svg AND streak.svg INSIDE this repo (self-hosted).
# Eliminates external service dependencies for both badges.
#
# Security notes:
# - The trophy action ref is PINNED to a commit SHA (immutable)
# - Uses only the built-in GITHUB_TOKEN (repo-scoped, expires after run)
# - Streak generation is pure GitHub API + SVG, no external services
#
name: Generate trophies and streak stats
on:
  schedule:
    - cron: "45 3 * * *" # daily at 03:45 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      
      - name: Generate trophy SVG
        # = Erik-Donath/github-profile-trophy@feature/generate-svg, pinned
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          file: trophy.svg
          theme: tokyonight
          max-rows: "1"
          max-cols: "7"
          margin-width: "8"
      
      - name: Generate streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -x  # Enable debug output
          node scripts/generate-streak.js
          echo "✅ Streak generation completed"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg streak.svg
          git diff --cached --quiet || git commit -m "Update trophy.svg and streak.svg"
          git push

